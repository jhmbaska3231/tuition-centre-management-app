# frontend/nginx.conf
#
# serves the built spa on 8080 as a non root user. /api is routed to the backend by the
# ingress, never by this server

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # kubernetes probe target that never touches the filesystem
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # if an api request ever reaches this server the ingress is misrouted. a clear 404 is
    # far easier to diagnose than the spa shell returned with a 200 and parsed as json
    location /api/ {
        return 404;
    }

    # vite emits content hashed filenames under /assets, so a file never changes once built
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # the spa shell must always be revalidated, otherwise a deploy leaves users on old code
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # client side routes (/parent, /invoices/123 etc) all resolve to the spa shell
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}