# frontend/nginx-security-headers.conf
#
# included in every location block rather than set once at server level. nginx discards
# all inherited add_header directives the moment a location declares one of its own, so
# headers set at server level would silently vanish from every location above that sets
# cache-control. this is the most common way nginx security headers go missing
#
# hsts is set at the ingress, where tls terminates

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;